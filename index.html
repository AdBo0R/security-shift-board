<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة ورديات الأمن – ميناء جدة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#f3f6fa; --line:#dbe3ec;
  --text:#0d2238; --muted:#5d7189; --faint:#94a5b8; --brand:#0d3b66;
  --morning:#d9952a; --afternoon:#d2603a; --night:#3f7cc0; --off:#9aa8b8;
  --ink-on-color:#ffffff; --focus:#3f7cc0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08131f; --surface:#102131; --surface2:#16293c; --line:#22384f;
    --text:#e8eef5; --muted:#91a5bb; --faint:#5f7389; --brand:#7fb3e8;
    --morning:#f2b643; --afternoon:#ec7b52; --night:#7fb3e8; --off:#53647a;
    --ink-on-color:#08131f; --focus:#7fb3e8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08131f; --surface:#102131; --surface2:#16293c; --line:#22384f;
  --text:#e8eef5; --muted:#91a5bb; --faint:#5f7389; --brand:#7fb3e8;
  --morning:#f2b643; --afternoon:#ec7b52; --night:#7fb3e8; --off:#53647a;
  --ink-on-color:#08131f; --focus:#7fb3e8;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  font-variant-numeric:tabular-nums;min-height:100%;padding:12px 12px 28px;
  -webkit-tap-highlight-color:transparent;
}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:520px;margin:0 auto}

/* ---------- header ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:4px 2px 12px;border-bottom:1px solid var(--line)}
.logo{flex:0 0 auto;height:54px;display:flex;align-items:center}
.logo img{height:54px;width:auto;max-width:none;object-fit:contain;display:block;background:transparent}
.logo .lg-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .lg-light{display:none}:root:not([data-theme="light"]) .logo .lg-dark{display:block}}
:root[data-theme="dark"] .logo .lg-light{display:none}
:root[data-theme="dark"] .logo .lg-dark{display:block}
.brand .title{flex:1;min-width:0}
.brand h1{font-size:17px;font-weight:700;line-height:1.3}
.brand .sub{font-size:12px;color:var(--muted);margin-top:1px}
.iconbtn{
  flex:0 0 38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.iconbtn svg{width:18px;height:18px;stroke:var(--muted)}

/* ---------- on-duty hero ---------- */
.now{
  margin-top:14px;border-radius:16px;padding:14px 16px 14px;color:var(--ink-on-color);
  background:var(--c);position:relative;overflow:hidden;
}
.now[hidden]{display:none}
.now .row1{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;opacity:.9}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.now .who{font-size:24px;font-weight:700;margin-top:6px;line-height:1.25}
.now .meta{font-size:13.5px;margin-top:2px;opacity:.92}
.bar{height:6px;border-radius:6px;background:rgba(0,0,0,.18);margin-top:12px;overflow:hidden}
.bar span{display:block;height:100%;background:currentColor;border-radius:6px;transition:width .4s}
.now .left{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;opacity:.9}

/* ---------- date bar ---------- */
.datebar{margin-top:14px;display:flex;align-items:center;gap:8px}
.navbtn{
  flex:0 0 44px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  font-size:24px;line-height:1;cursor:pointer;
}
.navbtn:active{background:var(--surface2)}
.datecenter{
  flex:1;text-align:center;cursor:pointer;position:relative;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:5px 6px;min-height:48px;
}
.datecenter .dt{font-size:16px;font-weight:700}
.datecenter .hj{font-size:11.5px;color:var(--muted)}
.datecenter input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.subbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;font-size:13px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--bg)}
.todaybtn{border:0;background:none;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:6px 4px}
.todaybtn.hidden{visibility:hidden}

/* ---------- day cards ---------- */
.cards{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px 10px;border-inline-start:5px solid var(--c);
}
.card.is-off{background:var(--surface2)}
.nowtag{font-size:11px;font-weight:700;color:var(--ink-on-color);background:var(--c);border-radius:6px;padding:1px 7px;margin-inline-start:8px;vertical-align:2px}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .sup{font-size:15.5px;font-weight:700}
.shift-id{
  font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;white-space:nowrap;
}
.card .mid{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--c)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.badge .hrs{color:var(--text);font-weight:500;font-size:13px}
.daynum{font-size:12px;color:var(--muted)}
.nextline{font-size:12.5px;color:var(--muted);margin-top:3px}
.nextline b{color:var(--text);font-weight:600}
.tape{display:flex;gap:2px;margin-top:9px;direction:ltr}
.tape .cell{
  flex:1;height:22px;border-radius:4px;background:var(--cellc);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--ink-on-color);font-weight:700;
}
.tape .cell.off{opacity:.45}
.tape .cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.tapedates{display:flex;gap:2px;margin-top:3px;direction:ltr}
.tapedates span{flex:1;text-align:center;font-size:10px;color:var(--faint)}
.tapedates span.sel{color:var(--text);font-weight:700}

/* ---------- week grid ---------- */
.week{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.week table{width:100%;border-collapse:collapse;min-width:420px}
.week th,.week td{text-align:center;padding:6px 3px;font-size:12px;border-bottom:1px solid var(--line)}
.week tr:last-child td{border-bottom:0}
.week thead th{font-weight:600;color:var(--muted);font-size:11px;line-height:1.35}
.week thead th b{display:block;color:var(--text);font-size:13px}
.week thead th.sel b{color:var(--brand)}
.week td.name{text-align:start;padding-inline-start:10px;font-weight:600;white-space:nowrap}
.week td.name small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.pill{
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:28px;border-radius:7px;
  background:var(--cellc);color:var(--ink-on-color);font-weight:700;font-size:12px;
}
.pill.off{opacity:.4}

.legend{display:flex;justify-content:center;gap:14px;margin-top:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:10px}
.foot button{border:0;background:none;color:var(--faint);text-decoration:underline;cursor:pointer;font-size:11px}

@media (prefers-reduced-motion:reduce){.live i{animation:none}.bar span{transition:none}}
@media print{
  body{background:#fff;color:#000}.navbtn,.iconbtn,.tabs,.todaybtn,.foot{display:none}
}
</style>
</head>

    </button>
  </header>

  <section class="now" id="now" aria-live="polite" hidden>
    <div class="row1"><span class="live"><i></i>على رأس العمل الآن</span><span id="nowShift"></span></div>
    <div class="who" id="nowWho"></div>
    <div class="meta" id="nowMeta"></div>

    <div class="left"><span id="nowLeft"></span><span id="nowNext"></span></div>

  <div class="cards" id="cards"></div>
  <div class="week" id="week" hidden></div>

  <div class="legend">
    <span><i style="background:var(--morning)"></i>صباح 6–14</span>
    <span><i style="background:var(--afternoon)"></i>عصر 14–22</span>
    <span><i style="background:var(--night)"></i>ليل 22–6</span>
    <span><i style="background:var(--off)"></i>إجازة</span>
  </div>
  <div class="foot">اسحب يمين أو يسار للتنقل بين الأيام</div>

<script>
// ---------- data ----------
const SHIFTS = [
  {id:'A', sup:'عبدالله الشيباني', anchor:'2026-07-18'},
  {id:'B', sup:'أحمد عبيد',       anchor:'2026-07-12'},
  {id:'C', sup:'محمود أبو طالب',  anchor:'2026-07-06'},
  {id:'D', sup:'حاتم الحربي',     anchor:'2026-06-30'},
];
// 24-day cycle: 0-5 morning, 6-7 off, 8-13 night, 14-15 off, 16-21 afternoon, 22-23 off
const TYPES = {
  morning:  {label:'صباح',  hrs:'6 – 14',  css:'var(--morning)',  short:'ص', order:0, start:6,  end:14},
  afternoon:{label:'عصر',   hrs:'14 – 22', css:'var(--afternoon)',short:'ع', order:1, start:14, end:22},
  night:    {label:'ليل',   hrs:'22 – 06', css:'var(--night)',    short:'ل', order:2, start:22, end:30},
  off:      {label:'إجازة', hrs:'',        css:'var(--off)',      short:'–', order:3},
};
const WD = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MO = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n, 12);
const diffDays = (a,b) => Math.round((a-b)/86400000);
const mod = (n,m) => ((n%m)+m)%m;
const fmtShort = d => `${d.getDate()} ${MO[d.getMonth()]}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let hijriFmt = null;
try { hijriFmt = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}); } catch(e){}

function stage(dateObj, anchorStr){
  const p = mod(diffDays(dateObj, D(anchorStr)), 24);
  if (p <= 5)  return {type:'morning',   day:p+1,  of:6};
  if (p <= 7)  return {type:'off',       day:p-5,  of:2};
  if (p <= 13) return {type:'night',     day:p-7,  of:6};
  if (p <= 15) return {type:'off',       day:p-13, of:2};
  if (p <= 21) return {type:'afternoon', day:p-15, of:6};
  return {type:'off', day:p-21, of:2};
}
function nextChange(dateObj, anchorStr){
  const cur = stage(dateObj, anchorStr).type;
  for (let i=1;i<=8;i++){
    const d2 = addDays(dateObj,i), s2 = stage(d2, anchorStr);
    if (s2.type !== cur) return {stage:s2, date:d2};
  }
}

// ---------- state ----------
const startOfToday = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12); };
let current = startOfToday();
let view = 'day';
const $ = id => document.getElementById(id);

// ---------- on duty now ----------
function onDutyId(){
  const n = new Date(), h = n.getHours();
  let type, base = startOfToday();
  if (h >= 6 && h < 14) type='morning'; else if (h >= 14 && h < 22) type='afternoon';
  else { type='night'; if (h < 6) base = addDays(base,-1); }
  const s = SHIFTS.find(x => stage(base, x.anchor).type === type);
  return s ? s.id : null;
}
function renderNow(){
  const n = new Date(), h = n.getHours() + n.getMinutes()/60;
  let type, baseDay = startOfToday();
  if (h >= 6 && h < 14) type = 'morning';
  else if (h >= 14 && h < 22) type = 'afternoon';
  else { type = 'night'; if (h < 6) baseDay = addDays(baseDay,-1); }
  const s = SHIFTS.find(x => stage(baseDay, x.anchor).type === type);
  const box = $('now');
  if (!s){ box.hidden = true; return; }
  const t = TYPES[type], st = stage(baseDay, s.anchor);
  const hh = (type==='night' && h < 6) ? h + 24 : h;
  const pct = Math.min(100, Math.max(0, (hh - t.start) / 8 * 100));
  const leftMin = Math.round((t.end - hh) * 60);
  const nextType = type==='morning' ? 'afternoon' : type==='afternoon' ? 'night' : 'morning';
  const nextDay = type==='night' ? addDays(baseDay,1) : baseDay;
  const ns = SHIFTS.find(x => stage(nextDay, x.anchor).type === nextType);
  box.hidden = false;
  box.style.setProperty('--c', t.css);
  $('nowShift').textContent = `SHIFT ${s.id}`;
  $('nowWho').textContent = s.sup;
  $('nowMeta').textContent = `وردية ${t.label} ${t.hrs} – اليوم ${st.day} من ${st.of}`;
  $('nowBar').style.width = pct + '%';
  $('nowLeft').textContent = `متبقي ${Math.floor(leftMin/60)} س ${leftMin%60} د`;
  $('nowNext').textContent = ns ? `التسليم لـ ${ns.sup}` : '';
}

// ---------- day view ----------
function renderDay(){
  const items = SHIFTS.map(s => ({s, st:stage(current, s.anchor)}));
  const isToday = diffDays(current, startOfToday())===0, dutyId = isToday ? onDutyId() : null;
  $('cards').innerHTML = items.map(({s, st}) => {
    const t = TYPES[st.type], nc = nextChange(current, s.anchor), nt = TYPES[nc.stage.type];
    const nextTxt = nc.stage.type === 'off'
      ? `بعدها <b>إجازة</b> من ${WD[nc.date.getDay()]} ${fmtShort(nc.date)}`
      : `بعدها <b>${nt.label} ${nt.hrs}</b> من ${WD[nc.date.getDay()]} ${fmtShort(nc.date)}`;
    const dayTxt = st.type === 'off' ? `يوم ${st.day} من ${st.of} إجازة` : `يوم ${st.day} من ${st.of}`;
    let tape='', tdates='';
    for (let i=-3;i<11;i++){
      const d2 = addDays(current,i), s2 = stage(d2, s.anchor), t2 = TYPES[s2.type];
      tape += `<div class="cell ${s2.type==='off'?'off':''} ${i===0?'sel':''}" style="--cellc:${t2.css}" title="${WD[d2.getDay()]} ${fmtShort(d2)}: ${t2.label}">${t2.short}</div>`;
      tdates += `<span class="${i===0?'sel':''}">${d2.getDate()}</span>`;
    }
    return `<article class="card ${st.type==='off'?'is-off':''}" style="--c:${t.css}">
      <div class="top"><div class="sup">${s.sup}${s.id===dutyId?'<span class="nowtag">مناوب الآن</span>':''}</div><div class="shift-id">SHIFT ${s.id}</div></div>
      <div class="mid">
        <span class="badge"><span class="dot"></span>${t.label}${t.hrs?`<span class="hrs">${t.hrs}</span>`:''}</span>
        <span class="daynum">${dayTxt}</span>
      </div>
      <div class="nextline">${nextTxt}</div>
      <div class="tape">${tape}</div>
      <div class="tapedates">${tdates}</div>
    </article>`;
  }).join('');
}

// ---------- week view ----------
function renderWeek(){
  const days = Array.from({length:7}, (_,i) => addDays(current, i));
  const head = days.map((d,i) => `<th class="${i===0?'sel':''}">${WD[d.getDay()].replace('ال','')}<b>${d.getDate()}</b></th>`).join('');
  const rows = SHIFTS.map(s => `<tr><td class="name">${s.sup.split(' ')[0]}<small>SHIFT ${s.id}</small></td>${
    days.map(d => { const st = stage(d, s.anchor), t = TYPES[st.type];
      return `<td><span class="pill ${st.type==='off'?'off':''}" style="--cellc:${t.css}" title="${t.label} ${t.hrs}">${t.short}</span></td>`; }).join('')
  }</tr>`).join('');
  $('week').innerHTML = `<table><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

function render(){
  $('dt').textContent = `${WD[current.getDay()]} ${current.getDate()} ${MO[current.getMonth()]} ${current.getFullYear()}`;
  $('hj').textContent = hijriFmt ? hijriFmt.format(current) : '';
  $('picker').value = iso(current);
  $('today').classList.toggle('hidden', diffDays(current, startOfToday())===0);
  $('cards').hidden = view !== 'day';
  $('week').hidden = view !== 'week';
  $('tabDay').setAttribute('aria-selected', view==='day');
  $('tabWeek').setAttribute('aria-selected', view==='week');
  view === 'day' ? renderDay() : renderWeek();
  renderNow();
}

const step = n => { current = addDays(current, n); render(); };
$('prev').onclick = () => step(view==='week' ? -7 : -1);
$('next').onclick = () => step(view==='week' ?  7 :  1);
$('today').onclick = () => { current = startOfToday(); render(); };
$('picker').onchange = e => { if (e.target.value){ current = D(e.target.value); render(); } };
$('tabDay').onclick = () => { view='day'; render(); };
$('tabWeek').onclick = () => { view='week'; render(); };

// swipe (RTL: swipe left = previous day)
let sx=null, sy=null;
document.addEventListener('touchstart', e => { sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (sx===null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && !e.target.closest('.week')) step((dx>0?1:-1) * (view==='week'?7:1));
  sx=null;
}, {passive:true});

// ---------- theme ----------
const store = {
  get:k => { try { return localStorage.getItem(k); } catch(e){ return null; } },
  set:(k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); return true; } catch(e){ return false; } }
};
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(store.get('theme'));
$('themeBtn').onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
  const t = dark ? 'light' : 'dark'; applyTheme(t); store.set('theme', t);
};


render();
setInterval(render, 60000);
</script>
</body>
</html>
